<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup 04 — Run monitor</title>
<style>
  /* Deliberately single-theme: mockup of the dark standalone shell. */
  :root {
    --bg: #0f1115; --surface: #161a21; --surface-2: #1c212a; --surface-3: #232936;
    --border: #2a303c; --border-soft: #212734;
    --text: #e8eaf0; --text-2: #9aa3b2; --text-3: #626c7d;
    --accent: #8b6cf0; --accent-soft: rgba(139,108,240,.16); --accent-border: rgba(139,108,240,.45);
    --ok: #4cc38a; --ok-soft: rgba(76,195,138,.13);
    --run: #58a6ff; --run-soft: rgba(88,166,255,.14);
    --err: #ef6a6a;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13.5px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* header: lifecycle */
  header { padding: 12px 20px 14px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .row1 { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .row1 h1 { margin: 0; font-size: 15px; font-weight: 680; }
  .elapsed { font: 600 12px/1 var(--mono); color: var(--text-2); font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  .btn { border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 7px 13px; font-weight: 620; font-size: 12.5px; }
  .btn:hover { border-color: var(--text-3); }
  .btn.danger { color: var(--err); border-color: rgba(239,106,106,.4); }
  .btn.danger:hover { border-color: var(--err); }
  .lifecycle { display: flex; align-items: center; gap: 0; margin-top: 12px; flex-wrap: wrap; }
  .ph { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--text-3); }
  .ph .pip { width: 9px; height: 9px; border-radius: 50%; background: var(--surface-3); border: 1.5px solid var(--border); }
  .ph.done { color: var(--text-2); } .ph.done .pip { background: var(--ok); border-color: var(--ok); }
  .ph.now { color: var(--run); font-weight: 640; } .ph.now .pip { background: var(--run); border-color: var(--run); animation: pulse 1.4s infinite; }
  .ph.now.finished { color: var(--ok); } .ph.now.finished .pip { background: var(--ok); border-color: var(--ok); animation: none; }
  .ph .ts { font-family: var(--mono); font-size: 10px; color: var(--text-3); }
  .conn { width: 34px; height: 1.5px; background: var(--border); margin: 0 9px; }
  .conn.done { background: var(--ok); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--run-soft); } }
  @media (prefers-reduced-motion: reduce) { .ph.now .pip { animation: none; } }

  .grid { display: grid; grid-template-columns: minmax(240px, 300px) 1fr; gap: 14px; padding: 14px 20px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .card .hd { display: flex; align-items: baseline; gap: 8px; padding: 11px 14px; border-bottom: 1px solid var(--border-soft); }
  .card .hd h2 { margin: 0; font-size: 12.5px; font-weight: 660; }
  .card .hd .sub { color: var(--text-3); font-size: 11px; }

  /* unit list */
  .unit { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; width: 100%; text-align: left; padding: 10px 14px; border-top: 1px solid var(--border-soft); }
  .unit:first-of-type { border-top: none; }
  .unit:hover { background: var(--surface-2); }
  .unit.sel { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
  .unit .nm { font-weight: 620; font-size: 12.5px; font-family: var(--mono); }
  .unit .dur { font: 500 11px/1.5 var(--mono); color: var(--text-3); font-variant-numeric: tabular-nums; }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 660; border-radius: 6px; padding: 2.5px 7px; justify-self: end; }
  .pill .ic { font: 700 9px/1 var(--mono); }
  .pill.finished { color: var(--ok); background: var(--ok-soft); }
  .pill.running { color: var(--run); background: var(--run-soft); }
  .pill.queued { color: var(--text-3); background: var(--surface-3); }
  .pbar { grid-column: 1 / -1; height: 4px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
  .pbar > div { height: 100%; background: var(--run); border-radius: 3px; transition: width .5s linear; }
  .list-foot { padding: 9px 14px; border-top: 1px solid var(--border-soft); font-size: 11px; color: var(--text-3); }
  .list-foot b { color: var(--text-2); font-family: var(--mono); font-weight: 640; }

  /* right column */
  .rcol { display: grid; gap: 14px; min-width: 0; }
  .chart-wrap { padding: 6px 8px 2px; position: relative; }
  svg.chart { width: 100%; height: 190px; display: block; }
  .tip {
    position: absolute; pointer-events: none; background: var(--surface-3); border: 1px solid var(--border);
    border-radius: 7px; padding: 5px 9px; font: 500 11px/1.5 var(--mono); color: var(--text);
    transform: translate(-50%, -110%); white-space: nowrap; display: none; font-variant-numeric: tabular-nums;
  }
  .delta { font-family: var(--mono); font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; }

  /* results strip (appears on finish) */
  .results { display: none; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .results.on { display: grid; }
  .res { background: var(--surface); border: 1px solid var(--ok); border-radius: 12px; padding: 11px 14px; }
  .res .k { font: 600 9.5px/1 var(--mono); letter-spacing: .12em; color: var(--text-3); text-transform: uppercase; }
  .res .v { font: 680 17px/1.3 var(--mono); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .res .v small { color: var(--text-3); font-size: 10.5px; font-weight: 500; }
  .res.cta { border-color: var(--border); display: grid; place-items: center; }

  /* log */
  .log { font: 11.5px/1.65 var(--mono); padding: 10px 14px; height: 170px; overflow-y: auto; color: var(--text-2); }
  .log div { white-space: nowrap; }
  .log .ts { color: var(--text-3); }
  .log .u { color: var(--accent); }
  .log .dim { opacity: .3; }
  .files { font-size: 11px; color: var(--text-3); }
  .files b { color: var(--text-2); font-family: var(--mono); font-weight: 640; }
</style>
</head>
<body>

<header>
  <div class="row1">
    <h1>Molecular Dynamics — Si, mp-149</h1>
    <span class="elapsed" id="elapsed">elapsed 00:00</span>
    <span class="spacer"></span>
    <button class="btn" id="replay">↻ Replay run</button>
    <button class="btn danger" id="terminate">Terminate</button>
  </div>
  <div class="lifecycle" id="lifecycle">
    <span class="ph done"><span class="pip"></span>Draft <span class="ts">14:02</span></span>
    <span class="conn done"></span>
    <span class="ph done"><span class="pip"></span>Queued <span class="ts">14:05</span></span>
    <span class="conn done"></span>
    <span class="ph now" id="phRun"><span class="pip"></span>Running <span class="ts">14:07</span></span>
    <span class="conn" id="connFin"></span>
    <span class="ph" id="phFin"><span class="pip"></span>Finished <span class="ts" id="tsFin">—</span></span>
  </div>
</header>

<div class="grid">
  <!-- units -->
  <div class="card">
    <div class="hd"><h2>Units</h2><span class="sub">click to filter the log</span></div>
    <div id="units"></div>
    <div class="list-foot"><span class="files"><b id="fileCount">3</b> files · <span id="fileNote">stdout updated just now</span></span></div>
  </div>

  <!-- chart + log -->
  <div class="rcol">
    <div class="results" id="results">
      <div class="res"><div class="k">Total energy</div><div class="v">−19.2634 <small>eV</small></div></div>
      <div class="res"><div class="k">Pressure</div><div class="v">0.42 <small>kbar</small></div></div>
      <div class="res"><div class="k">Wall used</div><div class="v" id="resWall">— <small>of 4 h</small></div></div>
      <div class="res cta"><button class="btn" style="border-color:var(--ok); color:var(--ok)">Open results →</button></div>
    </div>

    <div class="card">
      <div class="hd">
        <h2>Total energy convergence</h2>
        <span class="sub" id="chartUnit">cp-md</span>
        <span class="spacer"></span>
        <span class="delta" id="delta">ΔE —</span>
      </div>
      <div class="chart-wrap">
        <svg class="chart" id="chart" viewBox="0 0 720 190" preserveAspectRatio="none" role="img" aria-label="Total energy per iteration, converging toward −19.2634 eV"></svg>
        <div class="tip" id="tip"></div>
      </div>
    </div>

    <div class="card">
      <div class="hd"><h2>Log</h2><span class="sub" id="logScope">all units</span></div>
      <div class="log" id="log" aria-live="polite"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  var UNITS = [
    { id: "pw_scf",   dur: 34 },
    { id: "cp-md",    dur: 78 },
    { id: "dp_train", dur: 52 },
    { id: "exit",     dur: 4  }
  ];
  var LOGS = {
    "pw_scf":   ["reading pseudopotentials: Si.pbe-n-rrkjus_psl.UPF", "self-consistency reached in 11 iterations", "total energy = -19.30122841 Ry", "writing charge density"],
    "cp-md":    ["MD step %i of 200 · T = 300 K", "Ekin + Epot drift 2.1e-6 / step", "pair correlation updated", "trajectory written to cp.pos"],
    "dp_train": ["batch %i · loss 4.02e-3", "learning rate 1.0e-4", "validation RMSE(e) 1.8 meV/atom", "checkpoint saved model.ckpt-%i00"],
    "exit":     ["collecting artifacts", "job complete"]
  };

  var timers = [], t0, dataPts, iter, unitState, selUnit = null, finished;

  function clearTimers() { timers.forEach(clearTimeout); timers.forEach(clearInterval); timers = []; }

  function fmt(s) { return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }

  /* ---------- units panel ---------- */
  function renderUnits() {
    $("units").innerHTML = UNITS.map(function (u, i) {
      var st = unitState[i];
      var pill = st.status === "finished" ? '<span class="pill finished"><span class="ic">✓</span>finished</span>'
        : st.status === "running" ? '<span class="pill running"><span class="ic">▶</span>running</span>'
        : '<span class="pill queued"><span class="ic">○</span>queued</span>';
      var dur = st.status === "finished" ? fmt(u.dur) : st.status === "running" ? Math.round(st.pct) + "%" : "—";
      var bar = st.status === "running" ? '<div class="pbar"><div style="width:' + st.pct + '%"></div></div>' : "";
      return '<button class="unit' + (selUnit === u.id ? " sel" : "") + '" data-u="' + u.id + '">' +
        '<span class="nm">' + (i + 1) + " · " + u.id + '</span>' + pill +
        '<span class="dur">' + dur + "</span>" + bar + "</button>";
    }).join("");
    Array.prototype.forEach.call(document.querySelectorAll(".unit"), function (b) {
      b.addEventListener("click", function () {
        selUnit = selUnit === b.dataset.u ? null : b.dataset.u;
        $("logScope").textContent = selUnit ? selUnit + " only" : "all units";
        Array.prototype.forEach.call(document.querySelectorAll("#log div"), function (line) {
          line.classList.toggle("dim", !!selUnit && line.dataset.u !== selUnit);
        });
        renderUnits();
      });
    });
  }

  /* ---------- chart (single series: title names it — no legend) ---------- */
  var W = 720, H = 190, PAD = { l: 52, r: 64, t: 14, b: 20 };
  var E_FINAL = -19.2634;
  function energyAt(i) { return E_FINAL + 0.42 * Math.exp(-i / 9) * Math.cos(i / 2.1) + 0.11 * Math.exp(-i / 22); }

  function drawChart() {
    var n = dataPts.length;
    var svg = $("chart");
    if (n < 2) { svg.innerHTML = ""; return; }
    var xs = function (i) { return PAD.l + (W - PAD.l - PAD.r) * i / Math.max(n - 1, 39); };
    var lo = Math.min.apply(null, dataPts), hi = Math.max.apply(null, dataPts);
    var span = Math.max(hi - lo, 0.05); lo -= span * .1; hi += span * .1;
    var ys = function (v) { return PAD.t + (H - PAD.t - PAD.b) * (1 - (v - lo) / (hi - lo)); };
    var line = dataPts.map(function (v, i) { return (i ? "L" : "M") + xs(i).toFixed(1) + " " + ys(v).toFixed(1); }).join(" ");
    var area = line + " L" + xs(n - 1).toFixed(1) + " " + (H - PAD.b) + " L" + PAD.l + " " + (H - PAD.b) + " Z";
    var gridY = [0.25, 0.5, 0.75].map(function (f) {
      var y = (PAD.t + (H - PAD.t - PAD.b) * f).toFixed(1);
      return '<line x1="' + PAD.l + '" x2="' + (W - PAD.r) + '" y1="' + y + '" y2="' + y + '" stroke="#212734" stroke-width="1"/>';
    }).join("");
    var last = dataPts[n - 1], lx = xs(n - 1), ly = ys(last);
    svg.innerHTML =
      gridY +
      '<path d="' + area + '" fill="rgba(139,108,240,.10)"/>' +
      '<path d="' + line + '" fill="none" stroke="#8b6cf0" stroke-width="2" stroke-linejoin="round"/>' +
      '<circle cx="' + lx + '" cy="' + ly + '" r="4" fill="#8b6cf0" stroke="#0f1115" stroke-width="2"/>' +
      '<text x="' + (lx + 8) + '" y="' + (ly + 4) + '" font-size="11" font-family="ui-monospace,monospace" fill="#e8eaf0">' + last.toFixed(4) + "</text>" +
      '<text x="' + (PAD.l - 6) + '" y="' + (ys(hi - span * 0) - -4) + '" font-size="10" text-anchor="end" font-family="ui-monospace,monospace" fill="#626c7d">' + hi.toFixed(2) + "</text>" +
      '<text x="' + (PAD.l - 6) + '" y="' + (H - PAD.b) + '" font-size="10" text-anchor="end" font-family="ui-monospace,monospace" fill="#626c7d">' + lo.toFixed(2) + "</text>" +
      '<text x="' + (W - PAD.r) + '" y="' + (H - 5) + '" font-size="10" text-anchor="end" font-family="ui-monospace,monospace" fill="#626c7d">iteration ' + (n - 1) + "</text>";
    if (n > 1) {
      var dE = Math.abs(dataPts[n - 1] - dataPts[n - 2]);
      $("delta").textContent = "ΔE " + dE.toExponential(1) + " eV";
    }
    svg.onmousemove = function (ev) {
      var r = svg.getBoundingClientRect();
      var i = Math.round((ev.clientX - r.left) / r.width * (Math.max(n - 1, 39))); // px→index
      if (i < 0 || i >= n) { $("tip").style.display = "none"; return; }
      var tip = $("tip");
      tip.style.display = "block";
      tip.style.left = (xs(i) / W * r.width) + "px";
      tip.style.top = (ys(dataPts[i]) / H * r.height) + "px";
      tip.textContent = "iter " + i + " · " + dataPts[i].toFixed(4) + " eV";
    };
    svg.onmouseleave = function () { $("tip").style.display = "none"; };
  }

  /* ---------- log ---------- */
  var logI = 0;
  function pushLog(unit, msg) {
    var el = document.createElement("div");
    el.dataset.u = unit;
    if (selUnit && unit !== selUnit) el.classList.add("dim");
    el.innerHTML = '<span class="ts">14:' + String(7 + Math.floor((Date.now() - simStart) / 8000)).padStart(2, "0") + "</span> " +
      '<span class="u">[' + unit + "]</span> " + msg.replace("%i", String(20 + logI * 7)).replace("%i00", String(1 + logI) + "00");
    logI++;
    var log = $("log");
    log.appendChild(el);
    while (log.children.length > 60) log.removeChild(log.firstChild);
    log.scrollTop = log.scrollHeight;
  }

  /* ---------- simulation ---------- */
  var SPEED = 14; // sim seconds per real second
  var simStart;
  function start() {
    clearTimers();
    finished = false;
    unitState = UNITS.map(function () { return { status: "queued", pct: 0 }; });
    dataPts = []; iter = 0; logI = 0;
    selUnit = null;
    $("log").innerHTML = ""; $("logScope").textContent = "all units";
    $("results").classList.remove("on");
    var pr = $("phRun"); pr.classList.add("now"); pr.classList.remove("done"); pr.classList.remove("finished");
    pr.querySelector(".pip");
    $("phFin").classList.remove("now", "finished"); $("connFin").classList.remove("done");
    $("tsFin").textContent = "—";
    $("fileCount").textContent = "3";
    simStart = Date.now(); t0 = Date.now();

    var elapsedT = setInterval(function () {
      var s = Math.floor((Date.now() - simStart) / 1000 * SPEED);
      $("elapsed").textContent = finished ? $("elapsed").textContent : "elapsed " + fmt(s);
    }, 400);
    timers.push(elapsedT);

    // walk units sequentially
    var offset = 0;
    UNITS.forEach(function (u, idx) {
      var startAt = offset / SPEED * 1000, len = u.dur / SPEED * 1000;
      timers.push(setTimeout(function () {
        unitState[idx].status = "running"; renderUnits();
        var prog = setInterval(function () {
          unitState[idx].pct = Math.min(99, unitState[idx].pct + 100 / (len / 450));
          renderUnits();
        }, 450);
        timers.push(prog);
        var lg = setInterval(function () {
          var msgs = LOGS[u.id];
          pushLog(u.id, msgs[Math.floor(Math.random() * msgs.length)]);
          if (u.id === "cp-md") { dataPts.push(energyAt(iter++)); drawChart(); }
          if (Math.random() < .3) $("fileCount").textContent = String(+$("fileCount").textContent + 1);
        }, u.id === "cp-md" ? 550 : 900);
        timers.push(lg);
        timers.push(setTimeout(function () {
          clearInterval(prog); clearInterval(lg);
          unitState[idx].status = "finished"; renderUnits();
          if (idx === UNITS.length - 1) finish();
        }, len));
      }, startAt));
      offset += u.dur;
    });
  }

  function finish() {
    finished = true;
    pushLog("exit", "job complete");
    var pr = $("phRun"); pr.classList.remove("now"); pr.classList.add("done");
    $("connFin").classList.add("done");
    var pf = $("phFin"); pf.classList.add("now", "finished");
    $("tsFin").textContent = "14:10";
    $("resWall").innerHTML = fmt(UNITS.reduce(function (a, u) { return a + u.dur; }, 0)) + " <small>of 4 h</small>";
    $("results").classList.add("on");
    $("fileNote").textContent = "all artifacts stored";
  }

  $("replay").addEventListener("click", start);
  $("terminate").addEventListener("click", function () {
    clearTimers(); finished = true;
    pushLog("exit", "TERMINATED by user");
    renderUnits();
  });

  start();
})();
</script>
</body>
</html>
